<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School & College — Topla</title>
    <meta
      name="description"
      content="Topla untuk School & College: alat tulis pastel yang ramah, aman, dan menyenangkan untuk pelajar."
    />
    <meta property="og:title" content="Topla — School & College" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23b8e6d9'/%3E%3Ctext x='50' y='72' font-family='Arial' font-size='62' font-weight='bold' fill='%2324303a' text-anchor='middle'%3Et%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/school.css" />
  </head>
  <body class="theme-school" data-page="school" data-segment="school">
    <div id="site-header"></div>

    <main>
      <section class="school-hero">
        <div class="container school-hero-grid">
          <div class="school-hero-copy">
            <p class="eyebrow" data-i18n="school.eyebrow"></p>
            <h1 class="school-title">
              <span data-i18n="school.title"></span>
              <em data-i18n="school.titleAccent"></em>
            </h1>
            <p class="school-lead" data-i18n="school.desc"></p>
            <div class="school-actions">
              <a class="btn btn-school-primary" href="catalog.html?segment=school">
                <span data-i18n="school.cta1"></span>
                <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
              <a class="btn btn-school-ghost" href="#featured" data-i18n="school.cta2"></a>
            </div>
            <div class="school-stickers">
              <span class="sticker" data-i18n="school.sticker1"></span>
              <span class="sticker" data-i18n="school.sticker2"></span>
              <span class="sticker" data-i18n="school.sticker3"></span>
            </div>
          </div>
          <div class="school-hero-visual" id="school-hero-collage" aria-hidden="true"></div>
        </div>
        <div class="school-marquee" aria-hidden="true">
          <div class="marquee-track">
            <span data-i18n="school.marquee"></span>
            <span data-i18n="school.marquee"></span>
            <span data-i18n="school.marquee"></span>
            <span data-i18n="school.marquee"></span>
          </div>
        </div>
      </section>

      <section class="section school-featured" id="featured">
        <div class="container">
          <div class="section-head" data-reveal>
            <div>
              <p class="eyebrow" data-i18n="school.featured.eyebrow"></p>
              <h2 data-i18n="school.featured.title"></h2>
            </div>
            <p data-i18n="school.featured.desc"></p>
          </div>
          <div class="product-grid" data-products="featured"></div>
        </div>
      </section>

      <section class="school-more">
        <div class="container">
          <div class="school-more-head" data-reveal>
            <h2 data-i18n="school.more.title"></h2>
            <p data-i18n="school.more.desc"></p>
          </div>
          <div class="product-grid" data-products="more"></div>
        </div>
      </section>

      <section class="school-why">
        <div class="container">
          <div class="section-head" data-reveal>
            <div>
              <p class="eyebrow" data-i18n="school.why.eyebrow"></p>
              <h2 data-i18n="school.why.title"></h2>
            </div>
          </div>
          <div class="why-grid">
            <article class="why-card" data-reveal>
              <span class="why-icon">
                <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
              </span>
              <h3 data-i18n="school.why1.title"></h3>
              <p data-i18n="school.why1.desc"></p>
            </article>
            <article class="why-card" data-reveal>
              <span class="why-icon">
                <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>
              </span>
              <h3 data-i18n="school.why2.title"></h3>
              <p data-i18n="school.why2.desc"></p>
            </article>
            <article class="why-card" data-reveal>
              <span class="why-icon">
                <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l3.5-.9L19 7.6 16.4 5 5 16.5 4 20z"/><path d="M14.8 6.6l2.6 2.6"/></svg>
              </span>
              <h3 data-i18n="school.why3.title"></h3>
              <p data-i18n="school.why3.desc"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="school-band">
        <div class="container">
          <div class="band-inner" data-reveal>
            <div class="band-content">
              <p class="eyebrow">School &amp; College</p>
              <h2 data-i18n="school.band.title"></h2>
              <p data-i18n="school.band.desc"></p>
              <a class="btn" href="contact.html">
                <span data-i18n="school.band.cta"></span>
                <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
            </div>
          </div>
        </div>
      </section>

      <div class="container school-other">
        <span data-i18n="school.other"></span>
        <a href="office.html">
          <span data-i18n="school.otherCta"></span>
          <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="assets/js/pages/landing.js"></script>
  </body>
</html>
