<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office & Executive — Topla</title>
    <meta
      name="description"
      content="Topla untuk Office & Executive: kurasi alat tulis dan perlengkapan meja dengan presisi untuk ruang kerja yang tenang."
    />
    <meta property="og:title" content="Topla — Office & Executive" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1420'/%3E%3Ctext x='50' y='72' font-family='Georgia' font-size='58' fill='%23c9a227' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/office.css" />
  </head>
  <body class="theme-office" data-page="office" data-segment="office">
    <div id="site-header"></div>

    <main>
      <section class="office-hero">
        <div class="container office-hero-grid">
          <div class="office-hero-copy">
            <p class="eyebrow office-eyebrow" data-i18n="office.eyebrow"></p>
            <h1 class="office-title">
              <span data-i18n="office.title"></span>
              <em data-i18n="office.titleAccent"></em>
            </h1>
            <p class="office-lead" data-i18n="office.desc"></p>
            <div class="office-actions">
              <a class="btn btn-office-primary" href="catalog.html?segment=office">
                <span data-i18n="office.cta1"></span>
              </a>
              <a class="btn btn-office-ghost" href="contact.html" data-i18n="office.cta2"></a>
            </div>
            <div class="office-stats">
              <div class="office-stat">
                <strong>16</strong>
                <span data-i18n="office.stat1"></span>
              </div>
              <div class="office-stat">
                <strong>08</strong>
                <span data-i18n="office.stat2"></span>
              </div>
              <div class="office-stat">
                <strong>03</strong>
                <span data-i18n="office.stat3"></span>
              </div>
            </div>
          </div>
          <div class="office-visual">
            <div class="office-frame">
              <div class="office-frame-head">
                <span>Desk edit</span>
                <span>01 / 03</span>
              </div>
              <div class="office-mosaic" id="office-hero-collage" aria-hidden="true"></div>
              <div class="office-frame-foot">
                <span>Topla Maxximo</span>
                <span>2026</span>
              </div>
            </div>
            <div class="office-visual-caption">
              <span data-i18n="office.featured.eyebrow"></span>
              <a href="catalog.html?segment=office" data-i18n="common.viewAll"></a>
            </div>
          </div>
        </div>
      </section>

      <section class="section office-featured">
        <div class="container">
          <div class="office-section-head" data-reveal>
            <div>
              <p class="eyebrow office-eyebrow" data-i18n="office.featured.eyebrow"></p>
              <h2 data-i18n="office.featured.title"></h2>
            </div>
            <p class="office-head-copy" data-i18n="office.featured.desc"></p>
          </div>
          <div class="product-grid product-grid--office" data-products="featured"></div>

          <div class="office-more">
            <div class="office-more-head" data-reveal>
              <span>02</span>
              <h3 data-i18n="office.more.title"></h3>
              <p data-i18n="office.more.desc"></p>
            </div>
            <div class="product-grid product-grid--office" data-products="more"></div>
          </div>
        </div>
      </section>

      <section class="office-why">
        <div class="container office-why-grid">
          <div class="office-why-intro" data-reveal>
            <p class="eyebrow" data-i18n="office.why.eyebrow"></p>
            <h2 data-i18n="office.why.title"></h2>
          </div>
          <div class="office-principles">
            <div class="office-principle" data-reveal>
              <span class="op-num">01</span>
              <div>
                <h3 data-i18n="office.why1.title"></h3>
                <p data-i18n="office.why1.desc"></p>
              </div>
            </div>
            <div class="office-principle" data-reveal>
              <span class="op-num">02</span>
              <div>
                <h3 data-i18n="office.why2.title"></h3>
                <p data-i18n="office.why2.desc"></p>
              </div>
            </div>
            <div class="office-principle" data-reveal>
              <span class="op-num">03</span>
              <div>
                <h3 data-i18n="office.why3.title"></h3>
                <p data-i18n="office.why3.desc"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="office-band">
        <div class="container">
          <div class="office-band-inner" data-reveal>
            <div class="office-band-copy">
              <p class="eyebrow">Office &amp; Executive</p>
              <h2 data-i18n="office.band.title"></h2>
              <p data-i18n="office.band.desc"></p>
            </div>
            <a class="btn" href="contact.html">
              <span data-i18n="office.band.cta"></span>
              <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>
      </section>

      <div class="office-other-band">
        <div class="container office-other">
          <span data-i18n="office.other"></span>
          <a href="school.html">
            <span data-i18n="office.otherCta"></span>
            <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="assets/js/pages/landing.js"></script>
  </body>
</html>
