<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Topla — Satu katalog, dua dunia</title>
    <meta
      name="description"
      content="Demo Topla: satu katalog produk dengan dua pengalaman audiens — School & College dan Office & Executive."
    />
    <meta property="og:title" content="Topla — Satu katalog, dua dunia" />
    <meta
      property="og:description"
      content="Pilih segmen dan rasakan dua bahasa visual yang berbeda dari katalog yang sama."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231e2830'/%3E%3Ctext x='50' y='72' font-family='Arial' font-size='62' font-weight='bold' fill='%23b8e6d9' text-anchor='middle'%3Et%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body class="theme-neutral" data-page="home">
    <div id="site-header"></div>

    <main>
      <section class="home-intro container">
        <p class="eyebrow" data-i18n="home.eyebrow"></p>
        <h1 class="home-title" data-i18n="home.title"></h1>
        <p class="home-sub" data-i18n="home.sub"></p>
        <a class="home-continue" id="home-continue" href="school.html" hidden></a>
      </section>

      <section class="segment-chooser container" aria-label="Audience segments">
        <a class="segment-panel segment-panel--school" href="school.html">
          <div class="sp-top">
            <span class="sp-kicker" data-i18n="home.school.kicker"></span>
            <span class="sp-index">01</span>
          </div>
          <div
            class="sp-preview"
            id="school-panel-preview"
            aria-hidden="true"
          ></div>
          <div class="sp-bottom">
            <h2 data-i18n="common.school"></h2>
            <p data-i18n="home.school.desc"></p>
            <span class="sp-cta">
              <span data-i18n="home.school.cta"></span>
              <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
          </div>
        </a>

        <a class="segment-panel segment-panel--office" href="office.html">
          <div class="sp-top">
            <span class="sp-kicker" data-i18n="home.office.kicker"></span>
            <span class="sp-index">02</span>
          </div>
          <div
            class="sp-preview"
            id="office-panel-preview"
            aria-hidden="true"
          ></div>
          <div class="sp-bottom">
            <h2 data-i18n="common.office"></h2>
            <p data-i18n="home.office.desc"></p>
            <span class="sp-cta">
              <span data-i18n="home.office.cta"></span>
              <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
          </div>
        </a>
      </section>

      <section class="home-dual section">
        <div class="container">
          <div class="dual-head" data-reveal>
            <p class="eyebrow" data-i18n="home.dual.eyebrow"></p>
            <h2 data-i18n="home.dual.title"></h2>
            <p data-i18n="home.dual.desc"></p>
          </div>
          <div class="dual-grid">
            <div class="dual-side dual-side--school">
              <span class="dual-label" data-i18n="home.dual.schoolLabel"></span>
              <div class="dual-card" id="dual-school-card" data-reveal></div>
              <p class="dual-note" data-i18n="home.dual.noteSchool"></p>
            </div>
            <div class="dual-divider" aria-hidden="true">
              <span>Same SKU</span>
            </div>
            <div class="dual-side dual-side--office">
              <span class="dual-label" data-i18n="home.dual.officeLabel"></span>
              <div class="dual-card" id="dual-office-card" data-reveal></div>
              <p class="dual-note" data-i18n="home.dual.noteOffice"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="section home-teaser">
        <div class="container">
          <div class="home-teaser-head" data-reveal>
            <div>
              <p class="eyebrow" data-i18n="home.teaser.eyebrow"></p>
              <h2 data-i18n="home.teaser.title"></h2>
            </div>
            <div>
              <p data-i18n="home.teaser.desc"></p>
              <a class="text-link" href="catalog.html" style="margin-top: 14px">
                <span data-i18n="home.teaser.cta"></span>
                <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
            </div>
          </div>
          <div class="product-grid" id="home-teaser-grid"></div>
        </div>
      </section>

      <section class="home-brands">
        <div class="container">
          <div class="home-brands-head" data-reveal>
            <div>
              <p class="eyebrow" data-i18n="home.brands.eyebrow"></p>
              <h2 data-i18n="home.brands.title"></h2>
            </div>
            <p data-i18n="home.brands.desc"></p>
          </div>
          <div class="brand-strip" id="home-brand-strip"></div>
          <div class="home-brands-cta">
            <a class="text-link" href="sister-brands.html">
              <span data-i18n="home.brands.cta"></span>
              <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="assets/js/pages/home.js"></script>
  </body>
</html>
