<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontak — Topla</title>
    <meta
      name="description"
      content="Hubungi Topla untuk pertanyaan produk, pengadaan kantor, atau kerja sama distribusi."
    />
    <meta property="og:title" content="Topla — Kontak" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231e2830'/%3E%3Ctext x='50' y='72' font-family='Arial' font-size='62' font-weight='bold' fill='%23b8e6d9' text-anchor='middle'%3Et%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body class="theme-neutral" data-page="contact">
    <div id="site-header"></div>

    <main class="contact-page">
      <header class="contact-hero container">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.desc"></p>
      </header>

      <div class="container contact-grid">
        <div class="contact-info">
          <h2 data-i18n="contact.info"></h2>
          <div class="contact-list">
            <div class="contact-item">
              <span class="contact-icon">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
              </span>
              <div>
                <small data-i18n="contact.address"></small>
                <span>Jl. Contoh Raya No. 12, Jakarta Barat 11530</span>
              </div>
            </div>
            <div class="contact-item">
              <span class="contact-icon">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H5a2 2 0 00-2 2c0 8.8 7.2 16 16 16a2 2 0 002-2v-2l-4-1.5-1.8 2A13 13 0 018.5 6.8L10.5 5 9 3z"/></svg>
              </span>
              <div>
                <small data-i18n="contact.phone"></small>
                <a href="tel:+62215550123">+62 21 555 0123</a>
              </div>
            </div>
            <div class="contact-item">
              <span class="contact-icon">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
              </span>
              <div>
                <small data-i18n="contact.emailLabel"></small>
                <a href="mailto:hello@topla.example">hello@topla.example</a>
              </div>
            </div>
            <div class="contact-item">
              <span class="contact-icon">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
              </span>
              <div>
                <small data-i18n="contact.hours"></small>
                <span>Senin–Jumat, 09.00–17.00 WIB</span>
              </div>
            </div>
          </div>
          <a class="btn btn-wa contact-wa" href="https://wa.me/6281234567890" target="_blank" rel="noopener" data-i18n="nav.wa"></a>
        </div>

        <form class="contact-form" id="demo-contact-form" novalidate>
          <h2 data-i18n="contact.formTitle"></h2>
          <div class="form-field">
            <label for="contact-name" data-i18n="contact.name"></label>
            <input id="contact-name" name="name" type="text" autocomplete="name" />
          </div>
          <div class="form-field">
            <label for="contact-email" data-i18n="contact.email"></label>
            <input id="contact-email" name="email" type="email" autocomplete="email" />
          </div>
          <div class="form-field">
            <label for="contact-message" data-i18n="contact.message"></label>
            <textarea id="contact-message" name="message"></textarea>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="contact.send"></button>
          <p class="contact-note" data-i18n="contact.demoNote"></p>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="assets/js/pages/static.js"></script>
  </body>
</html>
